name: Manual campaign

# Jenkins-style parameterized trigger: pick an area (and optionally a single
# subcampaign) and run it on any branch via the Actions tab or:
#   gh workflow run manual-campaign.yml --ref <branch> -f area=abo -f subcampaign=cross-worker
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Test area to run"
        type: choice
        required: true
        default: abo
        options:
          - frontend
          - backend
          - ai-platform
          - abo
          - e2e-fullstack
          - vendor-contracts
          - ops-launch
      subcampaign:
        description: >
          Optional subcampaign name (see python3 test/run_campaigns.py --list).
          Leave empty to run the whole area. Example: cross-worker
        required: false
        default: ""

permissions:
  contents: read

jobs:
  campaign:
    name: manual-${{ inputs.area }}${{ inputs.subcampaign != '' && format('-{0}', inputs.subcampaign) || '' }}
    runs-on: ubuntu-latest
    # Generous ceiling; most targeted runs finish in minutes.
    timeout-minutes: 120
    env:
      CI: "true"
      CAMPAIGN_AREA: ${{ inputs.area }}
      CAMPAIGN_SUBCAMPAIGN: ${{ inputs.subcampaign }}
      HFS_RESET_SUPABASE: ${{ inputs.area == 'e2e-fullstack' && '1' || '0' }}
      HFS_PLATFORM_BIND_HOST: ${{ inputs.area == 'e2e-fullstack' && '0.0.0.0' || '127.0.0.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate campaign selection
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("test").resolve()))
          from run_campaigns import area_subcampaign_map

          area = "${{ inputs.area }}"
          subcampaign = "${{ inputs.subcampaign }}"
          available = area_subcampaign_map()
          if area not in available:
              raise SystemExit(f"Unknown campaign area: {area}")
          if subcampaign and subcampaign not in available[area]:
              options = ", ".join(available[area])
              raise SystemExit(f"Unknown subcampaign {area}/{subcampaign}. Available: {options}")
          print(f"Validated selection: {area}/{subcampaign or 'all'}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Flutter
        if: contains(fromJSON('["frontend", "e2e-fullstack"]'), inputs.area)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Supabase CLI
        if: contains(fromJSON('["frontend", "backend", "e2e-fullstack"]'), inputs.area)
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Install PostgreSQL client
        if: contains(fromJSON('["frontend", "backend", "e2e-fullstack"]'), inputs.area)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client sqlite3

      - name: Set up campaign area
        run: |
          echo "::group::Prepare campaign environment — ${CAMPAIGN_AREA}"
          bash .github/scripts/setup-campaign-area.sh "${CAMPAIGN_AREA}"
          echo "::endgroup::"

      - name: Run campaign
        id: campaign
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          started_epoch="$(date +%s)"
          echo "::group::Run campaign — ${CAMPAIGN_AREA}${CAMPAIGN_SUBCAMPAIGN:+/${CAMPAIGN_SUBCAMPAIGN}}"
          echo "Area: ${CAMPAIGN_AREA}"
          echo "Subcampaign: ${CAMPAIGN_SUBCAMPAIGN:-all}"
          echo "Branch/ref: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          set +e
          if [[ -n "${CAMPAIGN_SUBCAMPAIGN}" ]]; then
            python3 test/run_campaigns.py "${CAMPAIGN_AREA}" "${CAMPAIGN_SUBCAMPAIGN}"
          else
            python3 test/run_campaigns.py --full-area "${CAMPAIGN_AREA}"
          fi
          exit_code=$?
          set -e
          elapsed_seconds=$(( $(date +%s) - started_epoch ))
          echo "::endgroup::"
          run_dir="$(python3 test/report_campaign_ci.py --area "${CAMPAIGN_AREA}" --run latest --print-run-dir 2>/dev/null || true)"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=${elapsed_seconds}" >> "$GITHUB_OUTPUT"
          if [[ -n "${run_dir}" ]]; then
            echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          fi
          exit "${exit_code}"

      - name: Report failed test cases
        if: always()
        env:
          GOVERNOR_RUN: ${{ steps.campaign.outputs.run_dir }}
          CAMPAIGN_EXIT_CODE: ${{ steps.campaign.outputs.exit_code }}
          CAMPAIGN_STARTED_AT: ${{ steps.campaign.outputs.started_at }}
          CAMPAIGN_ELAPSED_SECONDS: ${{ steps.campaign.outputs.elapsed_seconds }}
        run: |
          run_ref="${GOVERNOR_RUN:-latest}"
          echo "::group::Campaign report — ${CAMPAIGN_AREA}"
          {
            echo "## Manual campaign: \`${CAMPAIGN_AREA}${CAMPAIGN_SUBCAMPAIGN:+/${CAMPAIGN_SUBCAMPAIGN}}\`"
            echo
            echo "- Branch/ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Campaign command exit code: \`${CAMPAIGN_EXIT_CODE:-not recorded}\`"
            echo "- Started (UTC): \`${CAMPAIGN_STARTED_AT:-not recorded}\`"
            echo "- Campaign wall time: \`${CAMPAIGN_ELAPSED_SECONDS:-not recorded}s\`"
            echo "- Artifacts: \`manual-${CAMPAIGN_AREA}-${CAMPAIGN_SUBCAMPAIGN:-full}-${GITHUB_RUN_ID}\` (campaign logs and reports)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 test/report_campaign_ci.py \
            --area "${CAMPAIGN_AREA}" \
            --run "${run_ref}" \
            --github-summary
          report_code=$?
          set -e
          echo "::endgroup::"
          if [[ "${CAMPAIGN_EXIT_CODE:-1}" != "0" || "${report_code}" != "0" ]]; then
            exit 1
          fi

      - name: Explain missing campaign artifacts
        if: always() && steps.campaign.outputs.run_dir == ''
        run: echo "No governor run directory was created; there are no campaign logs to upload."

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.area }}-${{ inputs.subcampaign != '' && inputs.subcampaign || 'full' }}-${{ github.run_id }}
          path: |
            test-results/governor/
            test-results/${{ inputs.area }}/
          if-no-files-found: ignore
          retention-days: 14
