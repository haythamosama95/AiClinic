name: CI

on:
  push:
    branches: [main, master, "001-*", "feature/*", "ai/**"]
  pull_request:
    branches: [main, master, ai/master]
  workflow_dispatch:

jobs:
  test-campaign:
    name: campaign-${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: frontend
            timeout_minutes: 90
            flutter: true
            supabase: true
            postgresql_client: false
          - area: backend
            timeout_minutes: 45
            flutter: false
            supabase: true
            postgresql_client: true
          - area: ai-platform
            timeout_minutes: 60
            flutter: false
            supabase: false
            postgresql_client: false
          - area: abo
            timeout_minutes: 60
            flutter: false
            supabase: false
            postgresql_client: false
          - area: e2e-fullstack
            timeout_minutes: 45
            flutter: false
            supabase: true
            postgresql_client: true
          - area: vendor-contracts
            timeout_minutes: 30
            flutter: false
            supabase: false
            postgresql_client: false
          - area: ops-launch
            timeout_minutes: 15
            flutter: false
            supabase: false
            postgresql_client: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Flutter
        if: matrix.flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Supabase CLI
        if: matrix.supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        if: matrix.postgresql_client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up campaign area
        run: bash .github/scripts/setup-campaign-area.sh ${{ matrix.area }}

      - name: Run full root campaign
        id: campaign
        run: |
          set +e
          python3 test/run_campaigns.py --full-area ${{ matrix.area }}
          exit_code=$?
          set -e
          run_dir="$(python3 test/report_campaign_ci.py --area ${{ matrix.area }} --run latest --print-run-dir 2>/dev/null || true)"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [[ -n "${run_dir}" ]]; then
            echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          fi
          exit "${exit_code}"

      - name: Report failed test cases
        if: always()
        env:
          GOVERNOR_RUN: ${{ steps.campaign.outputs.run_dir }}
        run: |
          run_ref="${GOVERNOR_RUN:-latest}"
          python3 test/report_campaign_ci.py \
            --area ${{ matrix.area }} \
            --run "${run_ref}" \
            --github-summary || true

      - name: Upload campaign artifacts
        if: always() && steps.campaign.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ matrix.area }}-${{ github.run_id }}
          path: |
            ${{ steps.campaign.outputs.run_dir }}/
            test-results/${{ matrix.area }}/
          if-no-files-found: ignore
          retention-days: 14
