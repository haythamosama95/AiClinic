name: CI

on:
  push:
    branches: [main, master, "001-*", "feature/*", "ai/**", "!ai/abo-master"]
  pull_request:
    branches: [main, master, ai/master]
  workflow_dispatch:

jobs:
  test-campaign:
    name: campaign-${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      CI: "true"
      CAMPAIGN_AREA: ${{ matrix.area }}
      HFS_RESET_SUPABASE: ${{ matrix.area == 'e2e-fullstack' && '1' || '0' }}
      HFS_PLATFORM_BIND_HOST: ${{ matrix.area == 'e2e-fullstack' && '0.0.0.0' || '127.0.0.1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: frontend
            timeout_minutes: 120
            flutter: true
            supabase: true
            postgresql_client: true
          - area: backend
            timeout_minutes: 45
            flutter: false
            supabase: true
            postgresql_client: true
          - area: ai-platform
            timeout_minutes: 60
            flutter: false
            supabase: false
            postgresql_client: false
          - area: abo
            timeout_minutes: 60
            flutter: false
            supabase: false
            postgresql_client: false
          - area: e2e-fullstack
            timeout_minutes: 110
            flutter: true
            supabase: true
            postgresql_client: true
          - area: vendor-contracts
            timeout_minutes: 30
            flutter: false
            supabase: false
            postgresql_client: false
          - area: ops-launch
            timeout_minutes: 15
            flutter: false
            supabase: false
            postgresql_client: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Flutter
        if: matrix.flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Supabase CLI
        if: matrix.supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        if: matrix.postgresql_client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client sqlite3

      - name: Set up campaign area
        run: |
          echo "::group::Prepare campaign environment — ${CAMPAIGN_AREA}"
          bash .github/scripts/setup-campaign-area.sh "${CAMPAIGN_AREA}"
          echo "::endgroup::"

      - name: Run full root campaign
        id: campaign
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          started_epoch="$(date +%s)"
          echo "::group::Run campaign — ${CAMPAIGN_AREA}"
          echo "Area: ${CAMPAIGN_AREA}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          set +e
          python3 test/run_campaigns.py --full-area "${CAMPAIGN_AREA}"
          exit_code=$?
          set -e
          elapsed_seconds=$(( $(date +%s) - started_epoch ))
          echo "::endgroup::"
          run_dir="$(python3 test/report_campaign_ci.py --area "${CAMPAIGN_AREA}" --run latest --print-run-dir 2>/dev/null || true)"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=${elapsed_seconds}" >> "$GITHUB_OUTPUT"
          if [[ -n "${run_dir}" ]]; then
            echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          fi
          exit "${exit_code}"

      - name: Report failed test cases
        if: always()
        env:
          GOVERNOR_RUN: ${{ steps.campaign.outputs.run_dir }}
          CAMPAIGN_EXIT_CODE: ${{ steps.campaign.outputs.exit_code }}
          CAMPAIGN_STARTED_AT: ${{ steps.campaign.outputs.started_at }}
          CAMPAIGN_ELAPSED_SECONDS: ${{ steps.campaign.outputs.elapsed_seconds }}
        run: |
          run_ref="${GOVERNOR_RUN:-latest}"
          echo "::group::Campaign report — ${CAMPAIGN_AREA}"
          {
            echo "## CI campaign: \`${CAMPAIGN_AREA}\`"
            echo
            echo "- Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- Branch/ref: \`${GITHUB_REF_NAME}\`"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Campaign command exit code: \`${CAMPAIGN_EXIT_CODE:-not recorded}\`"
            echo "- Started (UTC): \`${CAMPAIGN_STARTED_AT:-not recorded}\`"
            echo "- Campaign wall time: \`${CAMPAIGN_ELAPSED_SECONDS:-not recorded}s\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 test/report_campaign_ci.py \
            --area "${CAMPAIGN_AREA}" \
            --run "${run_ref}" \
            --github-summary
          report_code=$?
          set -e
          echo "::endgroup::"
          if [[ "${CAMPAIGN_EXIT_CODE:-1}" != "0" || "${report_code}" != "0" ]]; then
            exit 1
          fi

      - name: Explain missing campaign artifacts
        if: always() && steps.campaign.outputs.run_dir == ''
        run: echo "No governor run directory was created; there are no campaign logs to upload."

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ matrix.area }}-${{ github.run_id }}
          path: |
            test-results/governor/
            test-results/${{ matrix.area }}/
          if-no-files-found: ignore
          retention-days: 14

  ci-history:
    name: CI test history
    if: always()
    needs: [test-campaign]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find previous completed CI run on this branch
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_EVENT: ${{ github.event_name }}
        run: |
          previous_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "branch=${COMPARE_BRANCH}" \
            -f status=completed \
            -F per_page=100 \
            --jq '[.workflow_runs[] | select((.id | tostring) != env.CURRENT_RUN_ID and .event == env.CURRENT_EVENT)] | sort_by(.run_number) | last | .id // empty')"
          echo "run_id=${previous_run_id}" >> "$GITHUB_OUTPUT"

      - name: Download campaign reports
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
        run: |
          mkdir -p ci-history/current ci-history/previous
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir ci-history/current || true
          if [[ -n "${PREVIOUS_RUN_ID}" ]]; then
            gh run download "${PREVIOUS_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir ci-history/previous || true
          fi

      - name: Add test count comparison and charts to summary
        env:
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
        run: |
          args=(--current-run-id "${GITHUB_RUN_ID}")
          if [[ -n "${PREVIOUS_RUN_ID}" ]]; then
            args+=(--previous-run-id "${PREVIOUS_RUN_ID}")
          fi
          python3 test/ci_history_summary.py "${args[@]}"
