name: CI

on:
  push:
    branches: [main, master, "001-*", "feature/*", "ai/**"]
  pull_request:
    branches: [main, master, ai/master]

jobs:
  frontend-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Architecture guard (client R-12 lint)
        shell: pwsh
        run: |
          $guard = "tool/architecture_guard/architecture_guard.dart"
          $cases = @(
            @{
              Name = "guard_prompt_like_string_fails_build"
              Path = "tool/architecture_guard/fixtures/prompt_like_string"
              Category = "prompt-like string"
            },
            @{
              Name = "guard_provider_name_fails_build"
              Path = "tool/architecture_guard/fixtures/provider_name"
              Category = "provider name"
            },
            @{
              Name = "guard_model_identifier_fails_build"
              Path = "tool/architecture_guard/fixtures/model_identifier"
              Category = "model identifier"
            }
          )
          foreach ($case in $cases) {
            Write-Host "$($case.Name): expect exit 1 + category '$($case.Category)' on $($case.Path)"
            $output = & dart $guard $case.Path 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 1) {
              Write-Error "$($case.Name): expected exit 1 (violations), got $LASTEXITCODE (0=clean, 2=operator error)"
              exit 1
            }
            if ($output -notmatch [regex]::Escape($case.Category)) {
              Write-Error "$($case.Name): expected stderr to name category '$($case.Category)'"
              exit 1
            }
          }

          Write-Host "guard_multi_root_second_root_scanned: expect exit 1"
          $multiA = "tool/architecture_guard/fixtures/multi_root/root_a"
          $multiB = "tool/architecture_guard/fixtures/multi_root/root_b"
          & dart $guard $multiA $multiB 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 1) {
            Write-Error "Expected exit 1 when only the second scan root contains a violation; got $LASTEXITCODE"
            exit 1
          }

          Write-Host "guard_covers_every_client_source_path omission: expect non-zero (lib-only)"
          & dart $guard lib --assert-coverage 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Expected coverage assertion to fail when scan roots omit client sources"
            exit 1
          }

          Write-Host "guard_missing_scan_root_is_operator_error: expect exit 2"
          & dart $guard tool/architecture_guard/fixtures/does_not_exist 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) {
            Write-Error "Expected exit 2 for missing scan root; got $LASTEXITCODE"
            exit 1
          }

          Write-Host "guard_clean_tree_passes / guard_covers_every_client_source_path: expect-success"
          & dart $guard --assert-coverage
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Expected zero exit on clean client scan roots"
            exit 1
          }

          Write-Host "guard_test_root_is_live: plant violation under test/, expect exit 1, then clean up"
          $probe = "test/.architecture_guard_probe.dart"
          Set-Content -Path $probe -Value "const probe = 'deepseek';"
          try {
            & dart $guard --assert-coverage 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 1) {
              Write-Error "Expected exit 1 after planting a provider name under test/; got $LASTEXITCODE"
              exit 1
            }
          } finally {
            Remove-Item -Path $probe -ErrorAction SilentlyContinue
          }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --file-reporter=json:test-results/flutter.json

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Flutter tests
          path: frontend/test-results/*.json
          reporter: flutter-json
          fail-on-error: true

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: frontend/build/windows/x64/runner/Release/
          retention-days: 7

  ai-platform-eval-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run golden eval suite
        run: npx vitest run test/eval/golden.test.ts test/eval/conversation.test.ts test/eval/prohibitions.test.ts

      - name: Upload score report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-platform-golden-eval-reports
          path: ai-platform/test/eval/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
