name = "abo"
main = "../../../../abo/src/worker.ts"
compatibility_date = "2026-05-03"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["* * * * *", "0 * * * *", "0 */6 * * *", "0 6 * * *"]

[alias]
vendor-contracts = "./vendor-contracts-desktop-window.ts"

[env.development]
name = "abo-development"

[env.development.vars]
BILLING_HOST = "billing.vendor.test"
OPS_HOST = "ops.vendor.test"
HEARTBEAT_URL = "https://heartbeat.test/ping"
ALERT_EMAIL_TO = "alerts@clinic.invalid"
ISSUER_ID = "issuer-test"
ISSUER_KEYS = "[]"
CLOUDFLARE_ACCOUNT_ID = "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
R2_BUCKET_NAME = "abo-development"
PAYMOB_BASE_URL = "https://accept.paymob.com/api"
PAYMOB_SECRET_KEY = "paymob-secret-unconfigured"
PAYMOB_PUBLIC_KEY = "paymob-public-unconfigured"
PAYMOB_CARD_INTEGRATION_ID = "0"
PAYMOB_HMAC_SECRET = "paymob-hmac-unconfigured"
PAYMOB_API_KEY = "paymob-api-unconfigured"
ABO_GRANT_KEY = "{}"
PLATFORM_PUBLIC_KEYS = "[]"

[[env.development.send_email]]
name = "SEND_EMAIL"
destination_address = "alerts@clinic.invalid"

[[env.development.d1_databases]]
binding = "DB"
database_name = "abo-development"
database_id = "11111111-1111-1111-1111-111111111111"

[[env.development.r2_buckets]]
binding = "R2"
bucket_name = "abo-development"

[[env.development.services]]
binding = "PLATFORM"
service = "ai-platform-gateway-development"
entrypoint = "VendorEntrypoint"
