name = "ai-platform-gateway"
main = "src/worker.ts"
compatibility_date = "2026-05-03"

[dev]
ip = "127.0.0.1"
port = 8787

[triggers]
crons = ["0 3 * * *", "0 4 * * *"]

[[rules]]
type = "Text"
globs = ["prompts/**/*.md"]
fallthrough = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayObject"]

[env.development]
name = "ai-platform-gateway-development"

[env.development.vars]
BUILD_SHA = "local"
ENVIRONMENT = "development"
LOG_VERBOSITY = "2"
OPERATOR_ID = "platform-operator"

[[env.development.d1_databases]]
binding = "DB"
database_name = "ai-platform-development"
database_id = "11111111-1111-1111-1111-111111111111"

[[env.development.r2_buckets]]
binding = "R2"
bucket_name = "ai-platform-development"

[[env.development.durable_objects.bindings]]
name = "DO"
class_name = "GatewayObject"

[[env.development.ratelimits]]
name = "RATE_LIMITER_INSTALLATION"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.development.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_ACTOR"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.development.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_CAPABILITY"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[env.staging]
name = "ai-platform-gateway-staging"

[env.staging.vars]
BUILD_SHA = "local"
ENVIRONMENT = "staging"
LOG_VERBOSITY = "1"
OPERATOR_ID = "platform-operator"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ai-platform-staging"
database_id = "22222222-2222-2222-2222-222222222222"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "ai-platform-staging"

[[env.staging.durable_objects.bindings]]
name = "DO"
class_name = "GatewayObject"

[[env.staging.ratelimits]]
name = "RATE_LIMITER_INSTALLATION"
namespace_id = "2001"
simple = { limit = 600, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_ACTOR"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_CAPABILITY"
namespace_id = "2003"
simple = { limit = 300, period = 60 }

[env.production]
name = "ai-platform-gateway-production"

[env.production.vars]
BUILD_SHA = "local"
ENVIRONMENT = "production"
LOG_VERBOSITY = "0"
OPERATOR_ID = "platform-operator"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ai-platform-production"
database_id = "33333333-3333-3333-3333-333333333333"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "ai-platform-production"

[[env.production.durable_objects.bindings]]
name = "DO"
class_name = "GatewayObject"

[[env.production.ratelimits]]
name = "RATE_LIMITER_INSTALLATION"
namespace_id = "3001"
simple = { limit = 600, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_ACTOR"
namespace_id = "3002"
simple = { limit = 120, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMITER_INSTALLATION_CAPABILITY"
namespace_id = "3003"
simple = { limit = 300, period = 60 }
