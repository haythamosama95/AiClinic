openapi: 3.1.0
info:
  title: AI Gateway — Control Plane (Feature 015 / Phase 1)
  version: "1.0.0-phase1"
  description: >
    Client-facing contract for the AI Gateway control plane. Phase 1 delivers auth, health,
    capabilities, observability, and a NON-FUNCTIONAL generate stub. There is no AI generation:
    POST /v1/ai/generate returns 501 not_implemented. All endpoints except /health and /metrics
    require a valid Supabase JWT (Bearer), validated OFFLINE (no call to Supabase). The Gateway
    holds NO clinic-database credentials.
servers:
  - url: http://SERVER_NODE:8090
    description: Clinic LAN server node (plaintext HTTP acceptable on trusted LAN in V2)
tags:
  - name: health
  - name: capabilities
  - name: generate
  - name: observability

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness — process is up
      security: []            # unauthenticated (only endpoint exempt besides /metrics)
      responses:
        "200":
          description: Gateway process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /ready:
    get:
      tags: [health]
      summary: Readiness — at least one runner is READY
      description: Requires a valid JWT (per §10 all client-facing endpoints except /health).
      responses:
        "200":
          description: Ready — >= 1 runner in READY state
          content:
            application/json:
              schema:
                type: object
                required: [ready, ready_runners]
                properties:
                  ready: { type: boolean, enum: [true] }
                  ready_runners: { type: integer, minimum: 1 }
        "503":
          description: Not ready — no runner is READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/capabilities:
    get:
      tags: [capabilities]
      summary: Aggregate AI-layer capability (mirrors live registry)
      responses:
        "200":
          description: Capability snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/ai/generate:
    post:
      tags: [generate]
      summary: "STUB — not implemented in Phase 1"
      description: >
        Present so clients can feature-detect the route. Performs NO inference. Always returns
        501 not_implemented in this phase. Real generation ships in feature 016 / Phase 2.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Accepted and ignored in Phase 1 (shape reserved for Phase 2).
      responses:
        "501":
          description: Not implemented in this phase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: not_implemented
                  message: "AI generation is not available in this deployment phase."
                  request_id: "req_01H..."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics exposition
      security: []            # scraped locally on the LAN; not client-facing PHI
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase-issued JWT, validated OFFLINE via shared secret (HS256) or JWKS (RS/ES).
        Requires the caller's role to hold ai.access (coarse gate; authoritative enforcement
        remains at Supabase RPC in later phases).

  responses:
    Unauthenticated:
      description: Missing/invalid/expired/not-yet-valid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: unauthenticated, message: "Invalid or expired token.", request_id: "req_..." } }
    Forbidden:
      description: Valid token but role lacks ai.access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: forbidden, message: "Caller lacks ai.access.", request_id: "req_..." } }
    BadRequest:
      description: Malformed or oversized request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: bad_request, message: "Malformed request body.", request_id: "req_..." } }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, forbidden, not_implemented, rate_limited, ai_no_capacity, ai_timeout]
            message: { type: string }
            request_id: { type: string }

    Capabilities:
      type: object
      required: [schema_version, streaming, tasks, commands, runners]
      properties:
        schema_version: { type: string, example: "1.0" }
        streaming:
          type: boolean
          description: Reflects streaming_enabled config; no generation this phase regardless.
        tasks:
          type: array
          items: { type: string }
          description: EMPTY in Phase 1 (generation stubbed).
          example: []
        commands:
          type: array
          items: { type: string }
          description: EMPTY in Phase 1 (generation stubbed).
          example: []
        runners:
          type: array
          items: { $ref: "#/components/schemas/RunnerCapability" }

    RunnerCapability:
      type: object
      required: [id, status]
      properties:
        id: { type: string, example: runnerA }
        model: { type: string, nullable: true, example: "qwen3:4b" }
        digest: { type: string, nullable: true, example: "sha256:..." }
        status:
          type: string
          enum: [UNKNOWN, STARTING, READY, BUSY, DEGRADED, UNREACHABLE]
        features:
          type: array
          items: { type: string }
          example: ["json_grammar"]
        context_tokens: { type: integer, nullable: true, example: 8192 }

security:
  - supabaseJwt: []
