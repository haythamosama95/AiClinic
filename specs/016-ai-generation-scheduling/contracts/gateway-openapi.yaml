## `GET /v1/capabilities` — extended shape (Phase 2)

Same path and auth as Phase 1. The response shape is extended to advertise streaming + the
scheduling task and command types:

```json
{
  "schema_version": "1.0",
  "streaming": true,
  "tasks": ["command"],
  "commands": ["create_appointment", "reschedule_appointment", "cancel_appointment", "update_appointment_status"],
  "runners": [
    {
      "id": "runnerA",
      "model": "qwen3:4b",
      "digest": "sha256:…",
      "status": "READY",
      "features": ["json_grammar"],
      "context_tokens": 8192
    }
  ]
}
```

| Field        | Notes                                                                                       |
| ------------ | ------------------------------------------------------------------------------------------- |
| `streaming`  | Reflects `streaming_enabled` config.                                                        |
| `tasks`      | Lists `"command"` (the only in-scope task this phase). Other tasks reserved, not advertised. |
| `commands`   | Lists the four scheduling command types.                                                    |
| `runners[]`  | Mirrors the live registry (Phase 1 shape unchanged: id, model, digest, status, features, context_tokens). |

