# Local dev gateway config — Ollama co-located on 127.0.0.1:11434.
# Production: copy gateway.example.yaml and adjust runners, jwt_secret, origins.

port: 8090

runners:
  - id: ollama-local
    base_url: http://127.0.0.1:11434
    capabilities:
      - json_grammar
    models:
      - name: qwen3:4b-instruct
        source: qwen3:4b-instruct
        digest: sha256:0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
        context_tokens: 8192
        capabilities:
          - json_grammar

health_poll_interval_s: 10
unreachable_after_failures: 3

queue_max_depth: 16
queue_max_wait_s: 20
max_inflight_per_caller: 2
timeout_total_s: 120
timeout_first_token_s: 90
confidence_threshold: 0.6

jwt_secret: your-super-secret-jwt-token-with-at-least-32-characters-long
# Local `supabase start` issues ES256 tokens — JWKS validation is required.
jwks_url: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json

allowed_origins:
  - http://localhost:3000
  - http://localhost:8090

log_verbatim: false
log_verbatim_retention_hours: 24
enable_push_registration: false
internal_shared_secret: null

streaming_enabled: true
enable_multi_command_plans: false
model_swap_first_token_timeout_s: 60

models_dir: null

role_ai_access:
  administrator: true
  doctor: true
  receptionist: false
  lab_staff: false

log_dir: ./logs

# Dashboard Supabase sign-in (dev) — use the stack where auth works (`supabase start` → 54321).
# backend/local/.env may point at 55321 (docker compose kong) which often lacks auth routes.
supabase_url: http://127.0.0.1:54321
supabase_anon_key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2BBNWN8Bu4GE

# Dashboard signs in as bootstrap admin on load (dev only — disable in production).
dashboard_auto_sign_in: true
dashboard_dev_username: admin
dashboard_dev_password: admin
