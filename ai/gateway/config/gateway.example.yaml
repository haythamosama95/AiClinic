# AI Gateway configuration — all §14 keys with documented defaults.
# Copy to gateway.yaml and adjust for your deployment.

port: 8090

runners: []
# Example runner (uncomment and adjust):
# runners:
#   - id: ollama-local
#     base_url: http://127.0.0.1:11434
#     capabilities:
#       - json_grammar
#     models:
#       - name: qwen3:4b-instruct
#         source: qwen3:4b-instruct
#         digest: sha256:REPLACE_WITH_PINNED_DIGEST
#         context_tokens: 8192
#         capabilities:
#           - json_grammar

health_poll_interval_s: 10
unreachable_after_failures: 3

# Generation pipeline (§14)
queue_max_depth: 16
queue_max_wait_s: 20
max_inflight_per_caller: 2
timeout_total_s: 45
timeout_first_token_s: 15
model_swap_first_token_timeout_s: 60
confidence_threshold: 0.6
shutdown_grace_s: 10
log_verbatim_retention_hours: 24

# Offline JWT validation — at least one MUST be set
jwt_secret: null
jwks_url: null

# CORS allowlist — wildcard (*) is forbidden
allowed_origins:
  - http://localhost:3000

log_verbatim: true

# Optional push-based runner registration (default off)
enable_push_registration: false
internal_shared_secret: null

streaming_enabled: true
enable_multi_command_plans: false

models_dir: null

role_ai_access:
  administrator: true
  doctor: true
  receptionist: false
  lab_staff: false

log_dir: ./logs

# Optional — enables one-click staff sign-in on the control-plane dashboard (/dashboard).
# supabase_url: http://127.0.0.1:54321
# supabase_anon_key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
# dashboard_auto_sign_in: false
# dashboard_dev_username: admin
# dashboard_dev_password: admin
