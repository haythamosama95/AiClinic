# AI Gateway — supervised deployment (FR-005/FR-022).
# Mount config read-only; persist logs via named volume only.
# Phase 2 generation pipeline keys (queue, timeouts, streaming, confidence_threshold, etc.)
# live in config/gateway.yaml — see config/gateway.example.yaml for all §14 keys.
services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: always
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    volumes:
      - ./config:/app/config:ro
      - gateway_logs:/var/log/gateway
    environment:
      GATEWAY_CONFIG_PATH: /app/config/gateway.yaml
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_DASHBOARD_DIR: /app/dashboard
      GATEWAY_LOG_VERBATIM: "false"
      GATEWAY_LOG_VERBATIM_RETENTION_HOURS: "24"
      # Optional overrides for Phase 2 pipeline (defaults come from gateway.yaml):
      # GATEWAY_STREAMING_ENABLED: "true"
      # GATEWAY_QUEUE_MAX_DEPTH: "16"
      # GATEWAY_TIMEOUT_TOTAL_S: "45"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  gateway_logs:
