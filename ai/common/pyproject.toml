[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-common"
version = "0.1.0"
description = "Shared utilities for the AiClinic AI layer (gateway + runners)"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
